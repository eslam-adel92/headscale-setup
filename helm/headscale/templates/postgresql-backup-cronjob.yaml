{{- if and .Values.postgresql.enabled .Values.postgresql.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "headscale.postgresql.fullname" . }}-backup
  labels:
    {{- include "headscale.postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.postgresql.backup.storageClass }}
  storageClassName: {{ .Values.postgresql.backup.storageClass }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.postgresql.backup.size }} }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "headscale.postgresql.fullname" . }}-backup
  labels:
    {{- include "headscale.postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.postgresql.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "headscale.postgresql.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-backup
              image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              env:
                - { name: PGHOST,     value: {{ include "headscale.dbHost" . | quote }} }
                - { name: PGPORT,     value: {{ include "headscale.dbPort" . | quote }} }
                - { name: PGUSER,     value: {{ include "headscale.dbUser" . | quote }} }
                - { name: PGDATABASE, value: {{ include "headscale.dbName" . | quote }} }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "headscale.dbSecretName" . }}
                      key:  {{ include "headscale.dbSecretKey" . }}
                - { name: RETENTION_DAYS, value: {{ .Values.postgresql.backup.retentionDays | quote }} }
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump --format=custom --compress=6 --file=/backups/headscale-$TS.dump
                  find /backups -name 'headscale-*.dump' -mtime +${RETENTION_DAYS} -delete
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: tmp,     mountPath: /tmp }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "headscale.postgresql.fullname" . }}-backup
            - name: tmp
              emptyDir: { medium: Memory, sizeLimit: 32Mi }
{{- end }}
