apiVersion: apps/v1
kind: {{ if eq .Values.database.type "sqlite" }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ include "headscale.fullname" . }}
  labels: {{- include "headscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq .Values.database.type "sqlite" }}
  serviceName: {{ include "headscale.fullname" . }}-headless
  {{- end }}
  selector:
    matchLabels:
      {{- include "headscale.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  strategy:
    {{- if eq .Values.database.type "sqlite" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "headscale.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "headscale.fullname" . }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.database.type "postgres" }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ include "headscale.imageRef" .Values.postgresql.image }}"
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
                echo "waiting for postgres at $PGHOST:$PGPORT ..."
                sleep 2
              done
          env:
            - { name: PGHOST,     value: {{ include "headscale.dbHost" . | quote }} }
            - { name: PGPORT,     value: {{ include "headscale.dbPort" . | quote }} }
            - { name: PGUSER,     value: {{ include "headscale.dbUser" . | quote }} }
            - { name: PGDATABASE, value: {{ include "headscale.dbName" . | quote }} }
          securityContext:
            runAsUser: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      {{- end }}
      containers:
        - name: headscale
          image: "{{ include "headscale.imageRef" .Values.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http,    containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 9090, protocol: TCP }
            - { name: grpc,    containerPort: 50443, protocol: TCP }
            {{- if .Values.derp.embedded }}
            - { name: stun,    containerPort: {{ .Values.derp.stunPort }}, protocol: UDP }
            {{- end }}
          env:
            {{- if eq .Values.database.type "postgres" }}
            - name: HEADSCALE_DATABASE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "headscale.dbSecretName" . }}
                  key:  {{ include "headscale.dbSecretKey" . }}
            {{- end }}
            {{- with .Values.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/headscale, readOnly: true }
            - { name: data,   mountPath: /var/lib/headscale }
            - { name: tmp,    mountPath: /tmp }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "headscale.fullname" . }}-config
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        {{- if or (eq .Values.database.type "sqlite") (not .Values.persistence.enabled) }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "headscale.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and (eq .Values.database.type "sqlite") .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [{{ .Values.persistence.accessMode }}]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.persistence.size }} }
  {{- end }}
