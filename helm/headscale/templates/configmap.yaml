apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "headscale.fullname" . }}-config
  labels: {{- include "headscale.labels" . | nindent 4 }}
data:
  config.yaml: |
    server_url: {{ .Values.server.url }}
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: false

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    database:
    {{- if eq .Values.database.type "sqlite" }}
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true
    {{- else }}
      type: postgres
      postgres:
        host: {{ include "headscale.dbHost" . }}
        port: {{ include "headscale.dbPort" . }}
        name: {{ include "headscale.dbName" . }}
        user: {{ include "headscale.dbUser" . }}
        ssl: {{ include "headscale.dbSSL" . }}
        max_open_conns: {{ .Values.postgresql.clientConfig.maxOpenConns | default 25 }}
        max_idle_conns: {{ .Values.postgresql.clientConfig.maxIdleConns | default 25 }}
        conn_max_idle_time_secs: {{ .Values.postgresql.clientConfig.connMaxIdleTimeSecs | default 3600 }}
    {{- end }}

    derp:
      server:
        enabled: {{ .Values.derp.embedded }}
        region_id: {{ .Values.derp.regionId }}
        region_code: {{ .Values.derp.regionCode | quote }}
        region_name: {{ .Values.derp.regionName | quote }}
        stun_listen_addr: "0.0.0.0:{{ .Values.derp.stunPort }}"
        private_key_path: /var/lib/headscale/derp_private.key
        automatically_add_embedded_derp_region: true
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h

    dns:
      magic_dns: true
      base_domain: {{ .Values.server.baseDomain }}
      nameservers:
        global: [1.1.1.1, 9.9.9.9]

    log:
      level: info
      format: json

    policy:
      mode: file
      path: /etc/headscale/policy.hujson

    logtail:
      enabled: false

  policy.hujson: |
{{ .Values.policy.content | indent 4 }}
