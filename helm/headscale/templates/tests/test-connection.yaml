apiVersion: v1
kind: Pod
metadata:
  name: {{ include "headscale.fullname" . }}-test-connection
  labels: {{- include "headscale.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.securityContext | nindent 4 }}
  containers:
    - name: wget
      image: busybox:1.36
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      command:
        - wget
        - --spider
        - --timeout=10
        - "http://{{ include "headscale.fullname" . }}:8080/health"
