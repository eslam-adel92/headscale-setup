{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "headscale.fullname" . }}
  labels: {{- include "headscale.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [ {{ .Values.ingress.host | quote }} ]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /web is handled by ui-ingress.yaml — separate Ingress so basic-auth
          # annotations don't leak onto the API used by Tailscale clients.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "headscale.fullname" . }}
                port: { name: http }
{{- end }}
