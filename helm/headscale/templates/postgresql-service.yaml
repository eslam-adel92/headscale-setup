{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "headscale.postgresql.fullname" . }}
  labels: {{- include "headscale.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "headscale.postgresql.selectorLabels" . | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "headscale.postgresql.fullname" . }}-headless
  labels: {{- include "headscale.postgresql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "headscale.postgresql.selectorLabels" . | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}
