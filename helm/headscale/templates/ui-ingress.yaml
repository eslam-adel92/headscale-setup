{{- if and .Values.ui.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "headscale.fullname" . }}-ui
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-ui
  annotations:
    {{- with .Values.ingress.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- if .Values.ui.basicAuth.enabled }}
    nginx.ingress.kubernetes.io/auth-type:   basic
    nginx.ingress.kubernetes.io/auth-realm:  {{ .Values.ui.basicAuth.realm | quote }}
    nginx.ingress.kubernetes.io/auth-secret: {{ include "headscale.uiBasicAuthSecretName" . }}
    checksum/ui-auth: {{ include (print $.Template.BasePath "/ui-basic-auth-secret.yaml") . | sha256sum }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [ {{ .Values.ingress.host | quote }} ]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /web
            pathType: Prefix
            backend:
              service:
                name: {{ include "headscale.fullname" . }}-ui
                port: { name: http }
{{- end }}
