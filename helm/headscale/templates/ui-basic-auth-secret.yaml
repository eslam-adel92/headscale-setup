{{- /*
Basic-auth Secret for the /web Ingress.
Skipped when ui or ui.basicAuth is disabled, or when an existingSecret is set.
*/ -}}
{{- if and .Values.ui.enabled .Values.ui.basicAuth.enabled (not .Values.ui.basicAuth.existingSecret) }}
{{- $u := required "ui.basicAuth.username is required when basicAuth.enabled=true and no existingSecret" .Values.ui.basicAuth.username -}}
{{- $p := required "ui.basicAuth.password is required when basicAuth.enabled=true and no existingSecret — set via --set-string or a values-{env}.yaml under .gitignore" .Values.ui.basicAuth.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ui-auth" (include "headscale.fullname" .) }}
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-ui-auth
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  auth: {{ htpasswd $u $p | quote }}
{{- end }}
