# Skeleton config baked into the image. Overridden by mounted config /
# env vars in every real deployment.
server_url: https://hs.example.com
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

noise:
  private_key_path: /var/lib/headscale/noise_private.key

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

derp:
  server:
    enabled: true
    region_id: 900
    region_code: primary
    region_name: "Primary DERP"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_private.key
    automatically_add_embedded_derp_region: true
  urls: [https://controlplane.tailscale.com/derpmap/default]
  auto_update_enabled: true
  update_frequency: 24h

dns:
  magic_dns: true
  base_domain: hs.internal
  nameservers:
    global: [1.1.1.1, 9.9.9.9]

log:
  level: info
  format: json

policy:
  mode: file
  path: /etc/headscale/policy.hujson

logtail:
  enabled: false
