###############################################################################
# Build → Trivy scan → push BOTH images to GitHub Container Registry.
#   • headscale     from ./docker    → ghcr.io/<owner>/headscale
#   • headscale-ui  from ./docker/ui → ghcr.io/<owner>/headscale-ui
#
# Trivy action pinned to v0.36.0 by commit SHA (Mar 2026 supply-chain hardening).
# CodeQL action on v4 (v3 deprecates in Dec 2026).
#
# SARIF upload to GitHub Code Scanning is OPTIONAL and controlled by a
# repository variable:
#   Repo → Settings → Secrets and variables → Actions → Variables tab
#   → New repository variable  →  Name: ENABLE_SARIF_UPLOAD  Value: true
#
# When unset or "false" the workflow skips the upload step and only keeps
# the SARIF as a downloadable artifact (30-day retention). Enable it once
# you've turned on Code Scanning in Settings → Code security.
###############################################################################

name: build-image

on:
  workflow_dispatch:
    inputs:
      headscale_version:
        description: "Headscale upstream version (e.g. 0.29.1)"
        required: true
        default: "0.29.1"
      headscale_ui_version:
        description: "Headscale-UI upstream version (e.g. 2026.03.17)"
        required: true
        default: "2026.03.17"
      push:
        description: "Push to GHCR after scan passes?"
        type: boolean
        required: true
        default: true
      fail_on_vuln:
        description: "Fail on CRITICAL/HIGH Trivy findings?"
        type: boolean
        required: true
        default: true
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/build-image.yml"
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: read           # codeql-action needs this for the workflow-runs API
  packages: write
  security-events: write  # only used when ENABLE_SARIF_UPLOAD == "true"
  id-token: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  DEFAULT_HEADSCALE_VERSION: "0.29.1"
  DEFAULT_HEADSCALE_UI_VERSION: "2026.03.17"

jobs:
  build-scan:
    name: Build & Trivy scan (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    outputs:
      hs_version:    ${{ steps.versions.outputs.hs }}
      hs_ui_version: ${{ steps.versions.outputs.hs_ui }}
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: headscale,    context: ./docker,    build_arg_name: HEADSCALE_VERSION }
          - { name: headscale-ui, context: ./docker/ui, build_arg_name: HEADSCALE_UI_VERSION }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            HS="${{ inputs.headscale_version }}"; HS_UI="${{ inputs.headscale_ui_version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            HS="${GITHUB_REF_NAME#v}"; HS_UI="${DEFAULT_HEADSCALE_UI_VERSION}"
          else
            HS="${DEFAULT_HEADSCALE_VERSION}"; HS_UI="${DEFAULT_HEADSCALE_UI_VERSION}"
          fi
          echo "hs=$HS" >> "$GITHUB_OUTPUT"
          echo "hs_ui=$HS_UI" >> "$GITHUB_OUTPUT"

      - name: Pick build-arg value
        id: pick
        run: |
          if [[ "${{ matrix.component.name }}" == "headscale" ]]; then
            echo "value=${{ steps.versions.outputs.hs }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ steps.versions.outputs.hs_ui }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build local amd64 for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          platforms: linux/amd64
          push: false
          load: true
          build-args: ${{ matrix.component.build_arg_name }}=${{ steps.pick.outputs.value }}
          tags: local/${{ matrix.component.name }}:scan
          cache-from: type=gha,scope=${{ matrix.component.name }}-amd64
          cache-to:   type=gha,scope=${{ matrix.component.name }}-amd64,mode=max
          provenance: false

      - name: Trivy scan (gating)
        id: trivy
        # v0.36.0 — pinned by commit SHA for supply-chain safety.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/${{ matrix.component.name }}:scan
          format: table
          exit-code: ${{ (github.event_name == 'workflow_dispatch' && !inputs.fail_on_vuln) && '0' || '1' }}
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          timeout: 10m
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/${{ matrix.component.name }}:scan
          format: sarif
          output: trivy-${{ matrix.component.name }}.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          timeout: 10m
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub Code Scanning
        # Runs only when the repo variable ENABLE_SARIF_UPLOAD is set to
        # "true" AND the SARIF file was produced. On personal repos where
        # Code Scanning isn't enabled, leave the variable unset and the
        # SARIF ships as an artifact instead.
        if: |
          always() &&
          vars.ENABLE_SARIF_UPLOAD == 'true' &&
          hashFiles(format('trivy-{0}.sarif', matrix.component.name)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component.name }}.sarif
          category: trivy-${{ matrix.component.name }}

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component.name }}-sarif
          path: trivy-${{ matrix.component.name }}.sarif
          retention-days: 30
          if-no-files-found: warn

  push:
    name: Build & push (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    needs: build-scan
    if: |
      needs.build-scan.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.push)
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: headscale,    context: ./docker,    build_arg_name: HEADSCALE_VERSION }
          - { name: headscale-ui, context: ./docker/ui, build_arg_name: HEADSCALE_UI_VERSION }
    steps:
      - uses: actions/checkout@v4

      - name: Pick version
        id: pick
        run: |
          if [[ "${{ matrix.component.name }}" == "headscale" ]]; then
            echo "value=${{ needs.build-scan.outputs.hs_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ needs.build-scan.outputs.hs_ui_version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.component.name }}
          tags: |
            type=raw,value=${{ steps.pick.outputs.value }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.pick.outputs.value }}

      - name: Multi-arch build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.component.build_arg_name }}=${{ steps.pick.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.component.name }}-amd64
            type=gha,scope=${{ matrix.component.name }}-arm64
          cache-to: type=gha,scope=${{ matrix.component.name }}-arm64,mode=max
          provenance: false
